name: Deploy Backend

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Setup .NET
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: '8.0.x'
          
      - name: Publish
        run: dotnet publish backend/Qhse.Api/Qhse.Api.csproj -c Release -o ./publish
        
      - name: Deploy to Azure
        uses: azure/webapps-deploy@v2
        with:
          app-name: qhse-api-dev-amine
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: ./publish